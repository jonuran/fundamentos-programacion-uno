name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U jupyter-book ghp-import

      - name: Build the book
        run: |
          jupyter-book build fundamentos-programacion-uno

      - name: Deploy to GitHub Pages
        run: |
          ghp-import -n -p -f fundamentos-programacion-uno/_build/html
